name: Build PocketExpenses APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/pocket_expenses

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Restore release keystore
        run: echo "$RELEASE_KEYSTORE" | base64 -d > android/app/release.keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          STORE_FILE: android/app/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/PocketExpenses.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-expenses-apk
          path: apps/pocket_expenses/build/app/outputs/flutter-apk/PocketExpenses.apk
          retention-days: 30

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pocketexpenses-latest
          name: PocketExpenses Latest
          body: |
            Latest PocketExpenses APK build from main branch.

            Instalacao:
            1. Descarrega o ficheiro PocketExpenses.apk
            2. Permite a instalacao de apps de origens desconhecidas
            3. Instala e abre a app
          files: apps/pocket_expenses/build/app/outputs/flutter-apk/PocketExpenses.apk
          prerelease: false
          make_latest: true

      - name: Sync APK to website (pocketapps.pt)
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          set -e
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo "SITE_DEPLOY_TOKEN not set, skipping website sync"
            exit 0
          fi
          # Clone website repo with deploy token
          git clone --depth 1 https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/pocketapps-dev/pocketapps.github.io.git /tmp/website
          # Copy fresh APK over the hosted one
          cp build/app/outputs/flutter-apk/PocketExpenses.apk /tmp/website/apk/PocketExpenses.apk
          cd /tmp/website
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/PocketExpenses.apk
          # Only commit if the APK actually changed
          if git diff --cached --quiet; then
            echo "APK unchanged, skipping commit"
          else
            git commit -m "chore: update PocketExpenses.apk from CI build"
            git push origin main
            echo "Website APK updated successfully"
          fi